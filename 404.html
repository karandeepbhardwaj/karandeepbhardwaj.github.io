<title>404 — Page Not Found | Karandeep Bhardwaj</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;min-height:100dvh;

  }
  main{max-width:440px;}
  .code{
    font-family:ui-monospace,"SF Mono",Menlo,monospace;
    font-size:clamp(4.5rem,18vw,6rem);font-weight:600;letter-spacing:-.03em;line-height:1;
    margin:0 0 1rem;color:#2C2924;
  }
  p{font-size:1.05rem;color:#645F58;margin:0 0 2rem;line-height:1.55;}
  a{
    display:inline-block;padding:.7rem 1.4rem;font-size:.95rem;font-weight:600;
    color:#FBFAF7;background:#2C2924;border:1px solid #2C2924;border-radius:11px;
    text-decoration:none;
  }
  a:hover{background:#15130F;}
  a:focus-visible{outline:2px solid #15130F;outline-offset:3px;}
  @media (prefers-reduced-motion: reduce){
    a{transition:none;}
  }
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <p>This page wandered off. Let's get you back home.</p>
